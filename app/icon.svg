<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with subtle gradient -->
  <rect width="512" height="512" fill="#0B0B0B"/>
  <rect width="512" height="512" fill="url(#gradient)" opacity="0.3"/>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0B0B0B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- REX Text with better positioning -->
  <text 
    x="256" 
    y="330" 
    font-family="Arial, Helvetica, sans-serif" 
    font-size="160" 
    font-weight="900" 
    fill="#C9A96E" 
    text-anchor="middle"
    letter-spacing="-8"
  >REX</text>
  
  <!-- Subtle underline accent -->
  <rect x="156" y="360" width="200" height="4" fill="#C9A96E" opacity="0.5" rx="2"/>
</svg>
